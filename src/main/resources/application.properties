spring.application.name=novelblog
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#---
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=900000
#---
application.security.admin.name=${ADMIN_USERNAME}
application.security.admin.password=${ADMIN_PASSWORD}
application.security.admin.email=${ADMIN_EMAIL}